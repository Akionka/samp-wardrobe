name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always
  DLL_NAME: wardrobe.dll
  LUA_NAME: wardrobe_ui.lua
  DLL_PATH: target/i686-pc-windows-msvc/release/wardrobe.dll
  LUA_PATH: moonloader/wardrobe_ui/wardrobe_ui.lua

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: i686-pc-windows-msvc
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all-features --verbose

      - name: Build DLL
        run: cargo build --release --all-features

      - name: Prepare release directory
        shell: pwsh
        run: |
          $releaseDir = "release"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $releaseDir

          Copy-Item `
            $env:DLL_PATH `
            (Join-Path $releaseDir $env:DLL_NAME)

          Copy-Item `
            $env:LUA_PATH `
            (Join-Path $releaseDir $env:LUA_NAME)

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/${{ env.DLL_NAME }}
            release/${{ env.LUA_NAME }}
